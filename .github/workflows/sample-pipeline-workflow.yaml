name: Parallel API Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  java-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Java
        run: mvn -B package
        working-directory: java-api
      - uses: actions/upload-artifact@v4
        with:
          name: java-api
          path: java-api/target/*.jar

  node-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Node
        working-directory: node-api
        run: |
          npm install
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: node-api
          path: |
            node-api/index.js
            node-api/package.json

  java-deploy:
    needs: [java-build, node-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: java-api
      - run: echo "Deploying Java API to DEV (simulation)"

  node-deploy:
    needs: [java-build, node-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-api
      - run: echo "Deploying Node API to DEV (simulation)"
