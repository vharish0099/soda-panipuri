name: CI Build Pipeline

# 1. Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ "main","feature/develop" 
  pull_request:
    branches: [ "main" ]

# 2. Define the execution environment and sequential steps
jobs:
  build:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      # Step 1: Fetch the repository code onto the runner machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up your language runtime (Example: Node.js)
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Speeds up future builds by caching dependencies

      # Step 3: Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run the build command
      - name: Compile / Build Application
        run: npm run build --if-present

      # Step 5: Execute unit tests
      - name: Run Tests
        run: npm test
        